[package]
name = "learn"
version = "0.1.2"
edition = "2021"
description = "Behavior-learnings CLI (Rust port of skills/self-improving/bin/learn)"
license = "MIT"
publish = false

[[bin]]
name = "learn"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.14"
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
